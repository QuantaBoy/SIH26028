{% extends "base.html" %}

{% block head %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
  integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw=="
  crossorigin="anonymous">
<style>
  #controls { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1.5rem; margin: 0.5rem 0; }
  #hour { width: min(28rem, 90vw); }
  #hour-label { font-weight: bold; min-width: 11rem; }
  #wx-legend { display: flex; flex-wrap: wrap; gap: 0.25rem 1rem; padding: 0; margin: 0.4rem 0; list-style: none; }
  #wx-legend li { display: flex; align-items: center; gap: 0.35rem; }
  #wx-legend span { width: 1rem; height: 1rem; border: 1px solid #0003; }
  .train-label { background: #1f3b6f; color: #fff; border: 0; font-weight: bold; padding: 0 4px; }
  .train-label.planned { background: #fff; color: #1f3b6f; border: 1px solid #1f3b6f; }
</style>
{% endblock %}

{% block content %}
<h3>Entire Network</h3>
<p id="summary">Loading…</p>
<div id="controls">
  <label>Weather at <input id="hour" type="range" min="0" max="0" value="0" step="1"></label>
  <span id="hour-label"></span>
  <button id="now" type="button">Back to now</button>
</div>
<ul id="wx-legend"></ul>
<div id="map" style="height: 78vh"></div>
{% endblock %}

{% block scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
  integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g=="
  crossorigin="anonymous"></script>
<script>
// India divided into the weather cells the poller keeps forecasts for (about 55 km square),
// each shaded by its forecast; the rail network, junctions and tracked trains on top.
// Moving the hour slider shows the forecast for that hour and where each train will be then.
const map = L.map("map", { preferCanvas: true }).setView([22.5, 80], 5);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "&copy; OpenStreetMap contributors",
}).addTo(map);
const layers = L.control.layers(null, null, { collapsed: false }).addTo(map);
// Names come from data files, so they go in as text, never as HTML.
const text = (s) => Object.assign(document.createElement("div"), { textContent: s });

// Open-Meteo weather codes, grouped the way a passenger or a controller would care about them.
const KINDS = [
  { name: "Clear", codes: [0, 1], color: "#f7dc6f" },
  { name: "Cloudy", codes: [2, 3], color: "#d0d3d4" },
  { name: "Fog", codes: [45, 48], color: "#af7ac5" },
  { name: "Drizzle / light rain", codes: [51, 53, 55, 61, 80], color: "#85c1e9" },
  { name: "Rain", codes: [63, 66, 81], color: "#2e86c1" },
  { name: "Heavy rain", codes: [65, 67, 82], color: "#1b4f72" },
  { name: "Thunderstorm", codes: [95, 96, 99], color: "#6c3483" },
  { name: "Snow", codes: [71, 73, 75, 77, 85, 86], color: "#fdfefe" },
];
const kindOf = (code) => KINDS.find((k) => k.codes.includes(code)) || { name: "Unknown", color: "#999" };
KINDS.forEach((k) => {
  const li = document.createElement("li");
  li.innerHTML = "<span></span>";
  li.firstChild.style.background = k.color;
  li.append(k.name);
  document.getElementById("wx-legend").appendChild(li);
});

// The server names a cell by its centre, rounded like Python's round() (ties go to even).
let CELL = 0.5;
const pyRound = (x) => {
  const f = Math.floor(x), d = x - f;
  return d > 0.5 ? f + 1 : d < 0.5 ? f : (f % 2 === 0 ? f : f + 1);
};
const cellKey = (lat, lon) =>
  `${(pyRound(lat / CELL) * CELL).toFixed(2)},${(pyRound(lon / CELL) * CELL).toFixed(2)}`;

let grid = { cells: [], conditions: {} };
const byCell = new Map();       // "lat,lon" -> [lat, lon, temp, rain, wind, code]
const cellShapes = new Map();   // "lat,lon" -> rectangle on the map
const cellLayer = L.layerGroup().addTo(map);
layers.addOverlay(cellLayer, "Weather cells");

function describe(c) {
  if (!c) return "no forecast for this hour";
  const [, , temp, rain, wind, code] = c;
  return `${Math.round(temp)}°C, ${grid.conditions[code] || kindOf(code).name.toLowerCase()}` +
    (rain ? `, ${rain} mm rain` : "") + `, wind ${Math.round(wind)} km/h`;
}
const weatherAt = (lat, lon) => describe(byCell.get(cellKey(lat, lon)));

function drawGrid(g) {
  grid = g;
  CELL = g.cell_degrees;
  byCell.clear();
  g.cells.forEach((c) => {
    const key = `${c[0].toFixed(2)},${c[1].toFixed(2)}`;
    byCell.set(key, c);
    let shape = cellShapes.get(key);
    if (!shape) {
      const h = CELL / 2;
      shape = L.rectangle([[c[0] - h, c[1] - h], [c[0] + h, c[1] + h]],
        { weight: 0.4, color: "#fff", fillOpacity: 0.5 })
        .bindTooltip(() => text(`Cell ${key}: ${describe(byCell.get(key))}`), { sticky: true })
        .addTo(cellLayer);
      cellShapes.set(key, shape);
    }
    shape.setStyle({ fillColor: kindOf(c[5]).color });
  });
  refreshTrains();
}

// The hour slider: every forecast hour stored from now on (the poller keeps about two days).
const slider = document.getElementById("hour");
let hours = [];
const hourLabel = (h, i) => (i === 0 ? "Now" : new Date(h + ":00+05:30").toLocaleString("en-IN",
  { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", timeZone: "Asia/Kolkata" }));
// The time the map shows: live "now", or the start of the chosen forecast hour.
const shownTime = () => (+slider.value === 0 ? Date.now() : Date.parse(hours[+slider.value] + ":00+05:30"));

function loadGrid(hour) {
  return fetch(`/api/weather/grid${hour ? `?hour=${encodeURIComponent(hour)}` : ""}`)
    .then((r) => r.json())
    .then((g) => {
      if (!hours.length) {
        hours = g.hours;
        slider.max = Math.max(0, hours.length - 1);
      }
      drawGrid(g);
    });
}
slider.addEventListener("input", () => {
  document.getElementById("hour-label").textContent = hourLabel(hours[+slider.value], +slider.value);
});
slider.addEventListener("change", () => loadGrid(+slider.value === 0 ? null : hours[+slider.value]));
document.getElementById("now").addEventListener("click", () => {
  slider.value = 0;
  slider.dispatchEvent(new Event("input"));
  loadGrid(null);
});

// The rail network, faint, with its junctions; hover any junction for its weather.
fetch("/api/railway/network").then((r) => r.json()).then(({ sections, junctions }) => {
  const lines = L.layerGroup(sections.map((s) =>
    L.polyline(s.path, { color: "#34495e", weight: 1.2, opacity: 0.6 }))).addTo(map);
  const nodes = L.layerGroup(junctions.map((j) =>
    L.circleMarker([j.lat, j.lon], { radius: 2.5, weight: 1, color: "#1b2631", fillColor: "#fff", fillOpacity: 1 })
      .bindTooltip(() => text(`${j.name}${j.code ? ` (${j.code})` : ""}: ${weatherAt(j.lat, j.lon)}`))));
  layers.addOverlay(lines, "Rail network");
  layers.addOverlay(nodes, `Junctions (${junctions.length})`);
});

// Every station, off by default: 8,697 dots hide everything else at country zoom.
fetch("/api/railway/stations").then((r) => r.json()).then((geo) => {
  const located = geo.features.filter((f) => f.geometry);
  layers.addOverlay(L.geoJSON(located, {
    pointToLayer: (f, latlng) => L.circleMarker(latlng, { radius: 2, weight: 0, fillColor: "#c0392b", fillOpacity: 0.8 }),
    onEachFeature: (f, layer) => layer.bindTooltip(() => {
      const [lon, lat] = f.geometry.coordinates;
      return text(`${f.properties.name} (${f.properties.code}): ${weatherAt(lat, lon)}`);
    }),
  }), `Stations (${located.length})`);
});

// Tracked trains. The server sends each run's halt times (timetable + live delay when a live
// look is recent); the position between halts is worked out here, so trains glide without
// any extra call to the live-status service.
let runs = [];
const trainLayer = L.layerGroup().addTo(map);
layers.addOverlay(trainLayer, "Tracked trains");

function positionAt(run, t) {
  const d = run.delay * 60000;
  const hs = run.halts.map((h) => ({ ...h, a: Date.parse(h.arr) + d, dp: Date.parse(h.dep) + d }));
  const last = hs[hs.length - 1];
  if (t < hs[0].dp || t > last.a) return null;  // not running at this time
  for (let i = 0; i < hs.length - 1; i++) {
    const h = hs[i], n = hs[i + 1];
    if (t >= h.a && t <= h.dp) return { lat: h.lat, lon: h.lon, where: `at ${h.name}`, next: n };
    if (t > h.dp && t < n.a) {
      const f = (t - h.dp) / (n.a - h.dp);
      return { lat: h.lat + f * (n.lat - h.lat), lon: h.lon + f * (n.lon - h.lon),
               where: `between ${h.name} and ${n.name}`, next: n };
    }
  }
  return { lat: last.lat, lon: last.lon, where: `arriving at ${last.name}`, next: last };
}

function refreshTrains() {
  trainLayer.clearLayers();
  const t = shownTime();
  let shown = 0, live = 0;
  runs.forEach((run) => {
    const p = positionAt(run, t);
    if (!p) return;
    shown++;
    if (run.live) live++;
    L.polyline(run.halts.map((h) => [h.lat, h.lon]), { color: "#1f3b6f", weight: 2, opacity: 0.35 }).addTo(trainLayer);
    const eta = new Date(Date.parse(p.next.arr) + run.delay * 60000)
      .toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Kolkata" });
    const info = [
      `${run.number} ${run.name || ""} (run of ${run.start_date})`,
      p.where,
      run.live ? `live delay ${run.delay} min` : "position from the timetable (no recent live report)",
      `next: ${p.next.name} at ${eta}`,
      `weather here: ${weatherAt(p.lat, p.lon)}`,
      `weather at ${p.next.name}: ${weatherAt(p.next.lat, p.next.lon)}`,
    ].join(" · ");
    L.circleMarker([p.lat, p.lon], { radius: 7, weight: 2, color: "#1f3b6f",
                                     fillColor: run.live ? "#c0392b" : "#fff", fillOpacity: 1 })
      .bindTooltip(run.number, { permanent: true, direction: "top", offset: [0, -6],
                                 className: `train-label${run.live ? "" : " planned"}` })
      .bindPopup(() => {
        const box = text(info);
        const a = Object.assign(document.createElement("a"), { href: `/?train=${run.number}`, textContent: " Track live" });
        box.appendChild(a);
        return box;
      })
      .addTo(trainLayer);
  });
  document.getElementById("summary").textContent =
    `${grid.cells.length} weather cells of ${CELL}° (about 55 km) covering every station and junction. ` +
    `${shown} tracked train${shown === 1 ? "" : "s"} running at this time` +
    (live ? `, ${live} with a live delay` : "") + `. Filled marker = live delay, hollow = timetable position.`;
}

function loadTrains() {
  return fetch("/api/network/trains").then((r) => r.json()).then((r) => { runs = r; refreshTrains(); });
}

loadGrid(null).then(() => {
  document.getElementById("hour-label").textContent = hourLabel(hours[0], 0);
  return loadTrains();
});
setInterval(() => { if (+slider.value === 0 && !document.hidden) refreshTrains(); }, 10000);  // glide
setInterval(() => { if (!document.hidden) loadTrains(); }, 5 * 60000);                    // new delays
setInterval(() => { if (+slider.value === 0 && !document.hidden) loadGrid(null); }, 30 * 60000);  // next hour
</script>
{% endblock %}
